# ============================================================
# 5. 国内直连
# ============================================================

# 微信 / 腾讯关键域名显式直连，作为高频服务保护
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wx.qq.com,DIRECT
DOMAIN-SUFFIX,qq.com,DIRECT

# 精简 China 规则：约 3.7k 规则，替代十几万条 ChinaMax
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT

# 国内 IP
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaIPs/ChinaIPs.list,DIRECT

# GEOIP 放在末端，海外/AI 域名规则拥有更高优先级
GEOIP,CN,DIRECT


# ============================================================
# 6. 最终兜底
# ============================================================

FINAL,PROXY


[Host]
localhost = 127.0.0.1


[URL Rewrite]
# 不启用 URL Rewrite


[MITM]
# 稳定与省电优先，不启用 HTTPS 解密
hostname =
