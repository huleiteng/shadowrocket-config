[Host]
# ============================================================
# Host / DNS 指定
# 仅保留本机解析；国内直连域名由 dns-direct-system = true 处理
# 海外域名由规则与 proxy/fallback DNS 处理，避免 Host 绑定造成解析死循环
# ============================================================

# 本机与局域网
localhost = 127.0.0.1

[URL Rewrite]
# ============================================================
# URL Rewrite
# MITM 未开启时 HTTPS Rewrite 基本不生效，保留空段避免无效规则增加匹配开销
# ============================================================

[MITM]
# ============================================================
# MITM
# 省电与稳定优先：默认不配置 HTTPS 解密域名
# 这样不会额外安装/信任证书，也不会增加后台 CPU 与电量消耗
# 如需 HTTPS 级别去广告，可手动添加 hostname，但可能影响银行、支付、Apple、微信等 App
# ============================================================

hostname =
